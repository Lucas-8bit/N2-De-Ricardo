<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Budista</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f6e7d8, #f3d2a2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #5a3e2b;
    }

    .container{
      width: 100%;
      max-width: 500px;
    }

    .formulario{
      background: #fff8f0;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border: 2px solid #f0c38e;
    }

    .formulario h2{
      text-align: center;
      margin-bottom: 10px;
      color: #c96f1d;
      font-size: 30px;
    }

    .formulario p{
      text-align: center;
      margin-bottom: 25px;
      color: #7a5a45;
    }

    .form-group{
      margin-bottom: 20px;
    }

    .form-group label{
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #8b5a2b;
    }

    .form-group input,
    .form-group select{
      width: 100%;
      padding: 14px;
      border: 2px solid #e0b98b;
      border-radius: 12px;
      background: #fffdf9;
      font-size: 15px;
      transition: 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color: #d97b29;
      outline: none;
      box-shadow: 0 0 10px rgba(217,123,41,0.3);
    }

    .form-group small{
      display: block;
      margin-top: 6px;
      color: #8a7b6d;
      font-size: 12px;
    }

    .checkbox{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox input{
      width: auto;
    }

    button{
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e38b2c, #c96f1d);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover{
      transform: scale(1.03);
      opacity: 0.95;
    }

    .mensagem{
      margin-top: 20px;
      text-align: center;
      font-style: italic;
      color: #7a4f2a;
      background: #ffe9cc;
      padding: 15px;
      border-radius: 12px;
    }

    footer{
      text-align: center;
      margin-top: 20px;
      color: #6d4b32;
    }

    footer small{
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- FORMULÁRIO -->
    <div class="formulario" id="cadastro">
      
<a href="index.html" style="text-decoration: none; padding: 10px; background-color: #A0522D ; color: white; border-radius: 5px; padding: 5px 10px; border-radius: 8px; ">⌂ Home</a>
      <h2>Cadastro de Usuário</h2>

      <form>

        <div class="form-group">
          <label>Nome completo *</label>
          <input type="text" placeholder="Digite seu nome" required>
          <small>Apenas para personalizar seu atendimento</small>
        </div>

        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" placeholder="seuemail@exemplo.com" required>
          <small>Usaremos apenas para enviar conteúdos do site</small>
        </div>

        <div class="form-group checkbox">
          <input type="checkbox" required>
          <label>Concordo com a Política de Privacidade *</label>
        </div>

        <button type="submit">Cadastrar</button>
      </form>
    </div>

    <!-- FRASE -->
    <div class="mensagem">
      <strong>
        "A paz vem de dentro de você, e a segurança começa pela transparência."
      </strong>
    </div>

    <!-- RODAPÉ -->
    <footer>
      <p><small>Criado por Isaac, Ian, Rafael e Lucas.</small></p>
    </footer>

  </div>

</body>
</html>
